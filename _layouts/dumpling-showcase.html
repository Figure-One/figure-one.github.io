<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dumpl' Site Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/default.css">
</head>
<body>
    <div class="container">
        <a href="/dumpling" class="back-link">← Back to Main Page</a>

        <header>
            <h1>The Dumpl' Site Showcase</h1>
        </header>

        <p class="description">
            Everything fun in the server.
        </p>

        <div class="post">
            <h2>Gambling</h2>

            <div class="post-content">
                <p>
                    Using the custom tailor gambling bot, you can enjoy a peak gambling experience,
                    and climb the leaderboard ranks as you compete with others.
                </p>
            </div>
            
            <div class="gallery">
                <div class="gallery-main">
                    <img src="\assets\Dumpling\Showcase\a.png" alt="a" class="active">
                    <img src="\assets\Dumpling\Showcase\b.png" alt="b">

                    <div class="gallery-controls">
                        <button class="gallery-btn" onclick="changeImage(-1)">‹</button>
                        <button class="gallery-btn" onclick="changeImage(1)">›</button>
                    </div>
                    <button class="fullscreen-btn" onclick="openFullscreen(this)">⛶</button>
                </div>
                

                <div class="gallery-thumbnails">
                    <div class="thumbnail active" data-type="image" onclick="showImage(0)">
                        <img src="\assets\Dumpling\Showcase\a.png">
                    </div>
                    <div class="thumbnail" data-type="image" onclick="showImage(1)">
                        <img src="\assets\Dumpling\Showcase\b.png">
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="fullscreen-overlay" onclick="closeFullscreen(event)">
        <button class="fullscreen-close" onclick="closeFullscreen(event)">×</button>
        <div class="fullscreen-controls">
            <button class="fullscreen-nav-btn" onclick="changeFullscreenImage(-1)">‹</button>
            <button class="fullscreen-nav-btn" onclick="changeFullscreenImage(1)">›</button>
        </div>
        <div class="fullscreen-content"></div>
    </div>

    <script>
    let currentGallery = null;
    let currentFullscreenIndex = 0;

    function openFullscreen(btn) {
        currentGallery = btn.closest('.gallery');
        const gallery = btn.closest('.gallery-main');
        const activeMedia = gallery.querySelector('img.active, video.active');
        const allMedia = gallery.querySelectorAll('img, video');
        
        currentFullscreenIndex = Array.from(allMedia).indexOf(activeMedia);
        
        showFullscreenMedia(currentFullscreenIndex);
        
        const overlay = document.querySelector('.fullscreen-overlay');
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
        
        updateFullscreenButtons();
    }

    function showFullscreenMedia(index) {
        const gallery = currentGallery.querySelector('.gallery-main');
        const allMedia = gallery.querySelectorAll('img, video');
        const media = allMedia[index];
        
        const overlay = document.querySelector('.fullscreen-overlay');
        const content = overlay.querySelector('.fullscreen-content');
        
        content.innerHTML = '';
        
        if (media.tagName === 'VIDEO') {
            const video = document.createElement('video');
            video.src = media.src;
            video.controls = true;
            video.autoplay = true;
            video.loop = true;
            content.appendChild(video);
        } else {
            const img = document.createElement('img');
            img.src = media.src;
            img.alt = media.alt;
            content.appendChild(img);
        }
        
        currentFullscreenIndex = index;
    }

    function changeFullscreenImage(direction) {
        const gallery = currentGallery.querySelector('.gallery-main');
        const allMedia = gallery.querySelectorAll('img, video');
        
        currentFullscreenIndex = (currentFullscreenIndex + direction + allMedia.length) % allMedia.length;
        showFullscreenMedia(currentFullscreenIndex);
        updateFullscreenButtons();
    }

    function updateFullscreenButtons() {
        const gallery = currentGallery.querySelector('.gallery-main');
        const allMedia = gallery.querySelectorAll('img, video');
        const buttons = document.querySelectorAll('.fullscreen-nav-btn');
        
        if (allMedia.length <= 1) {
            buttons.forEach(btn => btn.style.display = 'none');
        } else {
            buttons.forEach(btn => btn.style.display = 'block');
        }
    }

    function closeFullscreen(e) {
        if (e.target.classList.contains('fullscreen-overlay') || 
            e.target.classList.contains('fullscreen-close') ||
            e.target.textContent === '×') {
            const overlay = document.querySelector('.fullscreen-overlay');
            const content = overlay.querySelector('.fullscreen-content');
            const video = content.querySelector('video');
            
            if (video) {
                video.pause();
            }
            
            overlay.classList.remove('active');
            document.body.style.overflow = '';
            
            setTimeout(() => {
                content.innerHTML = '';
            }, 300);
        }
    }

    document.addEventListener('keydown', (e) => {
        const overlay = document.querySelector('.fullscreen-overlay');
        if (overlay.classList.contains('active')) {
            if (e.key === 'Escape') {
                closeFullscreen({ target: overlay });
            } else if (e.key === 'ArrowLeft') {
                changeFullscreenImage(-1);
            } else if (e.key === 'ArrowRight') {
                changeFullscreenImage(1);
            }
        }
    });

    window.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.gallery').forEach(gallery => {
        let currentIndex = 0;
        const media = gallery.querySelectorAll('.gallery-main img, .gallery-main video');
        const thumbnails = gallery.querySelectorAll('.thumbnail');

        function showImage(index) {
        media.forEach(item => {
            if (item.tagName === 'VIDEO') {
            item.pause();
            item.currentTime = 0;
            }
            item.classList.remove('active');
        });
        thumbnails.forEach(thumb => thumb.classList.remove('active'));

        media[index].classList.add('active');
        thumbnails[index].classList.add('active');

        if (media[index].tagName === 'VIDEO') {
            media[index].play();
        }

        currentIndex = index;
        }

        function changeImage(direction) {
        currentIndex = (currentIndex + direction + media.length) % media.length;
        showImage(currentIndex);
        }

        gallery.querySelectorAll('.gallery-btn').forEach(btn => {
        btn.addEventListener('click', e => {
            const dir = e.target.textContent.includes('‹') ? -1 : 1;
            changeImage(dir);
        });
        });

        thumbnails.forEach((thumb, i) => {
        thumb.addEventListener('click', () => showImage(i));
        });

        if (media[0] && media[0].tagName === 'VIDEO') {
        media[0].play();
        }
    });
    });
    </script>

</body>
</html>
